<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f1f3d" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0a1020" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1.0"/>
    </radialGradient>

    <!-- Core Gradients -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <radialGradient id="corePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1.0; }
    }
    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes flowSupply {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flowBorrow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -60; }
    }
    @keyframes beaconPulse {
      0%, 100% { fill-opacity: 0.7; r: 3.5; }
      50% { fill-opacity: 1.0; r: 5; }
    }
    .flow-supply {
      stroke-dasharray: 6 14;
      animation: flowSupply 2.4s linear infinite;
    }
    .flow-borrow {
      stroke-dasharray: 6 14;
      animation: flowBorrow 2.4s linear infinite;
    }
    .core-pulse {
      transform-origin: 440px 220px;
      animation: pulseCore 3s ease-in-out infinite;
    }
    .orbit-spin {
      transform-origin: 440px 220px;
      animation: rotateOrbit 20s linear infinite;
    }
    .beacon {
      animation: beaconPulse 2s ease-in-out infinite;
    }
    .hud-text {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 10px;
      fill: #94a3b8;
    }
    .hud-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
    }
    .node-bg {
      fill: #0f172a;
      stroke: #1e293b;
      stroke-width: 1.2;
    }
  </style>

  <!-- Background -->
  <rect width="880" height="440" rx="16" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Architectural Background Grid -->
  <g opacity="0.18">
    <path d="M 0 60 H 880 M 0 110 H 880 M 0 160 H 880 M 0 210 H 880 M 0 260 H 880 M 0 310 H 880 M 0 360 H 880" stroke="#334155" stroke-width="0.8"/>
    <path d="M 110 0 V 440 M 220 0 V 440 M 330 0 V 440 M 440 0 V 440 M 550 0 V 440 M 660 0 V 440 M 770 0 V 440" stroke="#334155" stroke-width="0.8"/>
  </g>

  <!-- 1. Risk Perimeter Guardrail (Health Factor Orbit) -->
  <ellipse cx="440" cy="220" rx="350" ry="160" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 8"/>
  <ellipse cx="440" cy="220" rx="352" ry="162" fill="none" stroke="#10b981" stroke-width="1.0" opacity="0.6"/>

  <!-- Sentinel Beacons Orbiting -->
  <g class="orbit-spin">
    <circle cx="790" cy="220" r="4" fill="#10b981" class="beacon" filter="url(#glow)"/>
    <circle cx="265" cy="81" r="4" fill="#0ea5e9" class="beacon" filter="url(#glow)"/>
    <circle cx="265" cy="359" r="4" fill="#06b6d4" class="beacon" filter="url(#glow)"/>
  </g>

  <!-- 2. Capital Flow Bezier Trajectories -->
  <!-- Supply Inflow Paths -->
  <path d="M 180 120 Q 310 150 440 220" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.4"/>
  <path d="M 180 120 Q 310 150 440 220" fill="none" stroke="#10b981" stroke-width="2.5" class="flow-supply" filter="url(#glow)"/>

  <path d="M 150 220 Q 295 220 440 220" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.4"/>
  <path d="M 150 220 Q 295 220 440 220" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-supply" filter="url(#glow)"/>

  <path d="M 180 320 Q 310 290 440 220" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.4"/>
  <path d="M 180 320 Q 310 290 440 220" fill="none" stroke="#10b981" stroke-width="2.5" class="flow-supply" filter="url(#glow)"/>

  <!-- Collateral & Borrow Outflow Paths -->
  <path d="M 440 220 Q 570 150 700 120" fill="none" stroke="#0e7490" stroke-width="1.5" opacity="0.4"/>
  <path d="M 440 220 Q 570 150 700 120" fill="none" stroke="#06b6d4" stroke-width="2.5" class="flow-borrow" filter="url(#glow)"/>

  <path d="M 440 220 Q 570 290 700 320" fill="none" stroke="#0369a1" stroke-width="1.5" opacity="0.4"/>
  <path d="M 440 220 Q 570 290 700 320" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-borrow" filter="url(#glow)"/>

  <!-- 3. Concentric Ray Precision Index Rings (1e27 Scale) -->
  <ellipse cx="440" cy="220" rx="125" ry="55" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 6"/>
  <ellipse cx="440" cy="220" rx="160" ry="70" fill="none" stroke="#1e293b" stroke-width="1.0" stroke-dasharray="4 8"/>

  <!-- 4. Central Liquidity Reserve Core -->
  <g class="core-pulse">
    <circle cx="440" cy="220" r="45" fill="url(#corePulse)"/>
    <circle cx="440" cy="220" r="28" fill="url(#coreGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
    <!-- 3D Octahedral Crystal Facets -->
    <polygon points="440,165 478,220 440,240 402,220" fill="#38bdf8" fill-opacity="0.35" stroke="#7dd3fc" stroke-width="1.0"/>
    <polygon points="440,275 478,220 440,240 402,220" fill="#0369a1" fill-opacity="0.5" stroke="#0284c7" stroke-width="1.0"/>
  </g>

  <!-- Core Label Card -->
  <rect x="360" y="280" width="160" height="34" rx="8" class="node-bg" stroke="#0ea5e9"/>
  <text x="440" y="295" class="hud-title" text-anchor="middle">RESERVE CORE</text>
  <text x="440" y="307" class="hud-text" text-anchor="middle" fill="#38bdf8">$18.7M Cash • 1e27 Ray Index</text>

  <!-- 5. Asset Supply Nodes (Left) -->
  <!-- WETH Node -->
  <g transform="translate(60, 95)">
    <rect width="130" height="50" rx="8" class="node-bg" stroke="#0284c7"/>
    <rect width="4" height="50" rx="2" fill="#0ea5e9"/>
    <circle cx="22" cy="25" r="10" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="22" y="28" font-family="sans-serif" font-size="8" font-weight="bold" fill="#38bdf8" text-anchor="middle">ETH</text>
    <text x="40" y="22" class="hud-title">WETH Reserve</text>
    <text x="40" y="38" class="hud-text" fill="#10b981">3.85% APY <tspan fill="#64748b">• $3,150</tspan></text>
  </g>

  <!-- WBTC Node -->
  <g transform="translate(30, 195)">
    <rect width="130" height="50" rx="8" class="node-bg" stroke="#b45309"/>
    <rect width="4" height="50" rx="2" fill="#f59e0b"/>
    <circle cx="22" cy="25" r="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="22" y="28" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fbbf24" text-anchor="middle">BTC</text>
    <text x="40" y="22" class="hud-title">WBTC Reserve</text>
    <text x="40" y="38" class="hud-text" fill="#10b981">2.95% APY <tspan fill="#64748b">• $64.2k</tspan></text>
  </g>

  <!-- USDC Node -->
  <g transform="translate(60, 295)">
    <rect width="130" height="50" rx="8" class="node-bg" stroke="#047857"/>
    <rect width="4" height="50" rx="2" fill="#10b981"/>
    <circle cx="22" cy="25" r="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="22" y="28" font-family="sans-serif" font-size="8" font-weight="bold" fill="#34d399" text-anchor="middle">USD</text>
    <text x="40" y="22" class="hud-title">USDC Reserve</text>
    <text x="40" y="38" class="hud-text" fill="#10b981">4.68% APY <tspan fill="#64748b">• $1.00</tspan></text>
  </g>

  <!-- 6. Collateral & Borrow Nodes (Right) -->
  <!-- Collateral Matrix Node -->
  <g transform="translate(690, 95)">
    <rect width="140" height="50" rx="8" class="node-bg" stroke="#0891b2"/>
    <rect x="136" width="4" height="50" rx="2" fill="#06b6d4"/>
    <text x="15" y="22" class="hud-title">COLLATERAL HUB</text>
    <text x="15" y="38" class="hud-text" fill="#06b6d4">75% LTV <tspan fill="#64748b">• 80% LT</tspan></text>
  </g>

  <!-- Borrow Debt Hub -->
  <g transform="translate(690, 295)">
    <rect width="140" height="50" rx="8" class="node-bg" stroke="#0284c7"/>
    <rect x="136" width="4" height="50" rx="2" fill="#0ea5e9"/>
    <text x="15" y="22" class="hud-title">BORROW &amp; DEBT</text>
    <text x="15" y="38" class="hud-text" fill="#38bdf8">5.82% APR <tspan fill="#64748b">• 67.2% UTIL</tspan></text>
  </g>

  <!-- 7. Technical Header HUD -->
  <g transform="translate(20, 16)">
    <rect width="840" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.0"/>
    <circle cx="16" cy="14" r="3.5" fill="#10b981" class="beacon"/>
    <text x="28" y="18" class="hud-title">KORA PROTOCOL</text>
    <text x="140" y="18" class="hud-text">/ MODULAR RISK-AWARE LENDING INFRASTRUCTURE</text>
    <text x="825" y="18" class="hud-text" fill="#38bdf8" text-anchor="end">RAY 1e27 PRECISION</text>
  </g>

  <!-- 8. Technical Footer Status Bar -->
  <g transform="translate(20, 396)">
    <rect width="840" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.0"/>
    <text x="16" y="18" class="hud-text" fill="#cbd5e1">EVM PARIS 0.8.24</text>
    <text x="155" y="18" class="hud-text" fill="#10b981">• 100% SOLVENT (HF 1.84)</text>
    <text x="345" y="18" class="hud-text" fill="#94a3b8">• 90/90 PASSING UNIT &amp; INVARIANT TESTS</text>
    <text x="825" y="18" class="hud-text" fill="#38bdf8" text-anchor="end">TWO-KINK DYNAMIC RATE ENGINE</text>
  </g>
</svg>
